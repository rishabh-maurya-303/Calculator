<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="flex items-center">
    <div class="container flex justify-center mx-auto">

        <div class="calculator w-80 p-5 rounded-4xl">

            <div id="theme-switch">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#e3e3e3">
                    <path
                        d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                    fill="#e3e3e3">
                    <path
                        d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z" />
                </svg>
            </div>

            <div class="mx-auto py-5 flex flex-col w-70 h-50 items-end justify-end p-5">

                <div id="input"
                    class="w-full text-gray-400 text-lg text-right overflow-x-auto whitespace-nowrap scrollbar-hide">
                </div>

                <div id="output-div" class="relative w-full text-5xl font-semibold text-right overflow-x-auto whitespace-nowrap scrollbar-hide">
                    <span>=</span> <span id="result">0</span>
                </div>

            </div>

            <div class="buttons flex flex-col items-center gap-5 mt-5">
                <div class="row flex gap-5">
                    <div onclick="reset()" class="col operator">AC</div>
                    <div onclick="handleClickButton(this)" class="col operator"><i class="fa-solid fa-delete-left"></i>
                    </div>
                    <div onclick="handleClickButton(this)" class="col operator">%</div>
                    <div onclick="handleClickButton(this)" class="col pb-1 operator">/</div>
                </div>
                <div class="row flex gap-5">
                    <div onclick="handleClickButton(this)" class="col">7</div>
                    <div onclick="handleClickButton(this)" class="col">8</div>
                    <div onclick="handleClickButton(this)" class="col">9</div>
                    <div onclick="handleClickButton(this)" class="col pt-2 operator">*</div>
                </div>
                <div class="row flex gap-5">
                    <div onclick="handleClickButton(this)" class="col">4</div>
                    <div onclick="handleClickButton(this)" class="col">5</div>
                    <div onclick="handleClickButton(this)" class="col">6</div>
                    <div onclick="handleClickButton(this)" class="col pb-2 operator">-</div>
                </div>
                <div class="row flex gap-5">
                    <div class="left-col flex flex-col gap-5">
                        <div class="row flex gap-5">
                            <div onclick="handleClickButton(this)" class="col">1</div>
                            <div onclick="handleClickButton(this)" class="col">2</div>
                            <div onclick="handleClickButton(this)" class="col">3</div>
                        </div>
                        <div class="row flex gap-5">
                            <div onclick="handleClickButton(this)" class="col">0</div>
                            <div onclick="handleClickButton(this)" class="col pb-5 operator"
                                style="font-size: xx-large;">.</div>
                            <div onclick="handleClickButton(this)" class="col operator">=</div>
                        </div>
                    </div>
                    <div class="right-col float-right">
                        <div class="row">
                            <div onclick="handleClickButton(this)" class="col operator" style="height: 120px;">+</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
